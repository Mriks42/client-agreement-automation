name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0  # same major.minor as Atlas M0 in production
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --frozen
      # Explicit readiness wait instead of a container health check: the runner gives up on
      # service containers that are still "starting", which made the first run flaky.
      - name: Wait for MongoDB
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do sleep 1; done'
      # Job logs need repo-admin rights to read via the API; annotations don't. Surface the
      # service container's state and last log lines as annotations when anything fails.
      - name: Diagnose MongoDB service
        if: failure()
        working-directory: .
        run: |
          echo "::error::mongo status: $(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' ${{ job.services.mongo.id }})"
          docker logs --tail 8 ${{ job.services.mongo.id }} 2>&1 | cut -c1-300 | while IFS= read -r line; do echo "::warning::$line"; done
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
      # Offline detection eval (heuristics only, no API cost). Enabled once evals land.
      - run: if [ -f evals/run.py ]; then uv run python -m evals.run --offline; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:8.0  # same major.minor as Atlas M0 in production
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v5
      - name: Wait for MongoDB
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; do sleep 1; done'
      - run: docker build -t agreement-app .
      - name: Image has the converters and libraries
        run: |
          docker run --rm agreement-app soffice --version
          docker run --rm agreement-app python -c "import pymupdf, anthropic, pymongo; print('ok')"
      - name: Boots, serves the API and the SPA
        run: |
          docker run -d --name app --network host -e APP_ENV=dev -e PORT=8000 \
            -e MONGODB_URI=mongodb://localhost:27017 agreement-app
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -sS localhost:8000/api/health
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          docker logs app | tail -20
